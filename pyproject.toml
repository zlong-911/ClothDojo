[build-system]
requires = ["setuptools>=75,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clothdojo"
version = "0.1.0"
description = "Reproducible cloth-manipulation data agents and benchmarks."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
clothdojo = "clothdojo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clothdojo.collection" = ["static/*.html", "static/*.js", "static/*.css"]
"clothdojo.teleop" = ["teleop.kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "UP"]
