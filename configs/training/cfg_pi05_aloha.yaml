# ClothDojo's first guarded offline CFG gate.
# Both datasets are project-owned LeRobot v2.1 publications and carry the same
# tagged boolean advantage parquet. Run the CFG pipeline preflight first.
hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:CLOTHDOJO_TRAIN_OUTPUT}
    project_name: clothdojo
    experiment_name: shirt_flatten_cfg_pi05_aloha_acceptance_gate
    logger_backends: [tensorboard]
  max_epochs: -1
  # This is an acceptance gate. Evaluate checkpoints 50 and 100 before
  # authorizing a longer optimization run.
  max_steps: 400
  val_check_interval: -1
  save_interval: 50

data:
  num_workers: 4
  advantage_tag: ${oc.env:CLOTHDOJO_CFG_ADVANTAGE_TAG}
  # Keep this false: otherwise RLINF multiplies the explicit weights by each
  # dataset length and 0.75/0.25 no longer means 75% expert / 25% rollout.
  balance_dataset_weights: false
  seed: 42
  train_data_paths:
    - dataset_path: ${oc.env:CLOTHDOJO_CFG_EXPERT_DATASET}
      type: sft
      weight: 0.75
    - dataset_path: ${oc.env:CLOTHDOJO_CFG_ROLLOUT_DATASET}
      type: rollout
      weight: 0.25
      episodes_path: ${oc.env:CLOTHDOJO_CFG_ROLLOUT_EPISODES}

algorithm:
  adv_type: gae

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # Match the established STEAM CFG optimization batch: each of the eight
  # ranks processes micro-batches of 32 and accumulates twice, giving an
  # effective per-rank batch of 64 and a global batch of 512.
  micro_batch_size: 32
  global_batch_size: 512
  seed: 42
  model:
    # The project model is upstream CFG plus exact OpenPI data-argument
    # plumbing. It is registered through RLINF_EXT_MODULE, not a source patch.
    model_type: clothdojo_cfg_model
    model_path: ${oc.env:CLOTHDOJO_CFG_INIT_CHECKPOINT}
    precision: null
    num_action_chunks: 50
    action_dim: 14
    is_lora: false
    lora_rank: 32
    load_to_device: true
    add_value_head: false
    openpi:
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: 5
      cfgrl_guidance_scale: 1.0
      unconditional_prob: 0.5
      train_expert_only: true
      guidance_type: positive
      # STEAM conditions on both advantage labels; negative examples are not
      # silently collapsed into the unconditional branch.
      positive_only_conditional: false
    openpi_data:
      # Piper already uses the exported 14D order. The upstream CFG worker
      # currently drops these arguments, so ClothDojo's narrow worker passes
      # them to the same upstream get_openpi_config function.
      adapt_to_pi: false
      extra_delta_transform: true
      default_prompt: Flatten the shirt.
      norm_stats_path: ${oc.env:CLOTHDOJO_PI05_NORM_STATS}
  optim:
    lr: 2.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 25
    total_training_steps: 400
    min_lr: 2.0e-7
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: true
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
