# Replicate the best 2x learning rate with a second training seed and extend
# the fixed training budget from about two dataset epochs to about three.
# There is no metric-based early stopping; retain every 10k checkpoint so
# rollout evaluation can choose among 30k, 40k, 50k and 60k.
trials:
  - name: decay60k_lr2x_seed43
    overrides:
      - experiment.profile=decay_60k_lr_2x_seed43
      - training.seed=43
      - training.num_train_steps=60000
      - optimizer.peak_lr=5.0e-5
      - optimizer.decay_steps=60000
      - optimizer.decay_lr=5.0e-6
      - gates.pilot_steps=3000
      - logging.run_name=shirt_flatten_reviewed_good_pi05_jax_decay60k_lr2x_seed43
