schema: clothdojo_pi05_jax_matrix
format_version: 1
name: pi05_aloha_lr2x_50k_decay_20260827
base_config: pi05_aloha_jax.yaml
status_dir: ${oc.env:CLOTHDOJO_JAX_MATRIX_DIR}
continue_on_error: false
stages: [initialize, overfit, pilot, parity, full]

# Isolate optimizer stability from peak LR: match lr2x/seed42 and move only the
# cosine endpoint from 60k to the selected 50k stopping point. Save every 5k
# so the 40k/45k/50k tail is directly comparable.
trials:
  - name: decay50k_lr2x_seed42
    overrides:
      - experiment.profile=decay_50k_lr_2x_seed42
      - training.num_train_steps=50000
      - training.save_interval=5000
      - training.keep_period=5000
      - optimizer.peak_lr=5.0e-5
      - optimizer.decay_steps=50000
      - optimizer.decay_lr=5.0e-6
      - gates.pilot_steps=3000
      - logging.run_name=shirt_flatten_reviewed_good_pi05_jax_decay50k_lr2x_seed42
      - logging.wandb_group=pi05_sft_lr_stability
