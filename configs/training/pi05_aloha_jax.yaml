# OpenPI/JAX is the numerical SFT reference. RLINF consumes its converted EMA
# checkpoint later for rollout and CFG; it is not used to optimize this run.
schema: clothdojo_pi05_jax_sft
format_version: 1

experiment:
  # Profiles are validated in code so a matrix trial cannot silently drift
  # outside the reviewed optimizer family.
  profile: openpi_reference

openpi:
  config_name: pi05_aloha_robotwin
  data:
    adapt_to_pi: false
    extra_delta_transform: true
    default_prompt: Flatten the shirt.
    # PyAV wheels carry their decoder libraries; TorchCodec needs a matching
    # host FFmpeg installation and is therefore not the portable SFT baseline.
    video_backend: pyav

paths:
  dataset: ${oc.env:CLOTHDOJO_LEROBOT_DATASET}
  norm_stats: ${oc.env:CLOTHDOJO_PI05_NORM_STATS}
  # This is the Orbax params directory, not the Hugging Face/RLINF directory.
  base_params: ${oc.env:CLOTHDOJO_PI05_JAX_PARAMS}
  # Released Hugging Face conversion of the same base, used only by parity.
  pytorch_base: ${oc.env:CLOTHDOJO_PI05_PYTORCH_BASE}
  openpi_data_home: ${oc.env:CLOTHDOJO_OPENPI_CACHE}
  checkpoint_base_dir: ${oc.env:CLOTHDOJO_JAX_CHECKPOINT_BASE}
  gate_dir: ${oc.env:CLOTHDOJO_JAX_GATE_DIR}

training:
  seed: 42
  batch_size: 64
  num_workers: 16
  fsdp_devices: 8
  num_train_steps: 40000
  log_interval: 100
  save_interval: 10000
  keep_period: 10000

optimizer:
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_steps: 30000
  decay_lr: 2.5e-6
  adam_b1: 0.9
  adam_b2: 0.95
  adam_eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0
  ema_decay: 0.99

gates:
  overfit_steps: 200
  pilot_steps: 1000
  overfit_max_loss_ratio: 0.8

logging:
  project_name: clothdojo
  run_name: shirt_flatten_reviewed_good_pi05_aloha_jax_40k
  wandb_group: pi05_sft_comparison
  wandb_enabled: true
