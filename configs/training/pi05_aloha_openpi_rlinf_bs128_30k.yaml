defaults:
  - pi05_aloha_openpi_rlinf_lr2x_60k
  - _self_

# Large-batch control for the complete non-mirrored trajectory collection.
# B128 x 30k consumes the same number of training examples as B64 x 60k.
clothdojo:
  jax_reference: null
  worker_environment:
    GLOO_SOCKET_IFNAME: eth0
    NCCL_SOCKET_IFNAME: eth0
    NCCL_IB_DISABLE: "1"
    NCCL_IB_GID_INDEX: null
    NCCL_IB_HCA: null
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7

runner:
  max_steps: 30000
  save_interval: 5000
  logger:
    experiment_name: shirt_flatten_full_pi05_openpi_rlinf_bs128_30k_seed43

actor:
  global_batch_size: 128
  optim:
    lr: 7.071067811865476e-5
    total_training_steps: 30000
    lr_warmup_steps: 500
    min_lr: 7.071067811865476e-6
