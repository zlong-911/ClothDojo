schema: clothdojo_pi05_jax_matrix
format_version: 1
name: pi05_aloha_execution_focus_20260827
base_config: pi05_aloha_jax.yaml
status_dir: ${oc.env:CLOTHDOJO_JAX_MATRIX_DIR}
continue_on_error: false
stages: [initialize, overfit, pilot, parity, full]

# Match the 2x/60k/seed42 training cell and change only how Pi0.5's 50 action
# offsets are reduced. At focus=0.5 the offsets used by the h=10, d=0 RTC
# execution window receive twice the weight of the remaining context offsets.
trials:
  - name: decay60k_lr2x_seed42_execution_focus
    overrides:
      - experiment.profile=decay_60k_lr_2x_seed42
      - training.num_train_steps=60000
      - optimizer.peak_lr=5.0e-5
      - optimizer.decay_steps=60000
      - optimizer.decay_lr=5.0e-6
      - gates.pilot_steps=3000
      - loss.action_offset.profile=fixed_delay_rtc
      - loss.action_offset.focus=0.5
      - loss.action_offset.exec_horizon=10
      - loss.action_offset.delay_steps=0
      - logging.run_name=shirt_flatten_reviewed_good_pi05_jax_decay60k_lr2x_seed42_execution_focus
      - logging.wandb_group=pi05_sft_execution_focus
