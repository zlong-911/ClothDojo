defaults:
  - pi05_aloha_openpi_rlinf_mirrored_bs256_30k
  - _self_

# Fresh pi05_base training on the same 1838 mirrored episodes.
# Keep the existing optimizer parameter groups; only change decay strength.
# Preserve the 30k cosine schedule, then train 10k more at its learning-rate floor.
clothdojo:
  image_augmentation: false
  worker_environment:
    NCCL_IB_GID_INDEX: null

cluster:
  num_nodes: 4

runner:
  max_steps: 40000
  save_interval: 5000
  logger:
    experiment_name: shirt_flatten_nocs1838_mirrored_noaug_promptfix_bs256_wd001_40k_seed43

actor:
  model:
    openpi_data:
      default_prompt: flatten the shirt
  optim:
    lr: 5.0e-5
    weight_decay: 0.01
    lr_warmup_steps: 1000
    total_training_steps: 30000
    min_lr: 5.0e-6
