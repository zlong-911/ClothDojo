# ClothDojo's one-expected-epoch offline CFGRL optimization run.
#
# This preserves the accepted data, labels, initialization and source
# mixture.  It changes only the optimization batch/update schedule and adopts
# STEAM's published 0.1 conditioning dropout.  With 1,249,976 eligible frames,
# 5,000 updates at global batch 256 expose approximately one dataset-equivalent
# of samples.  The weighted sampler remains stochastic, so this is an expected
# epoch rather than an exhaustive traversal of every frame.
hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:CLOTHDOJO_TRAIN_OUTPUT}
    project_name: clothdojo
    experiment_name: shirt_flatten_cfg_pi05_aloha_one_expected_epoch
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 5000
  val_check_interval: -1
  # 500 updates correspond to 128k sampled frames, about one tenth of the
  # planned data exposure.
  save_interval: 500

data:
  num_workers: 4
  # Keep explicit weights as source probabilities instead of multiplying them
  # by dataset length.
  balance_dataset_weights: false
  seed: 42
  train_data_paths:
    - dataset_path: ${oc.env:CLOTHDOJO_CFG_EXPERT_DATASET}
      type: sft
      weight: 0.75
    - dataset_path: ${oc.env:CLOTHDOJO_CFG_ROLLOUT_DATASET}
      type: rollout
      weight: 0.25

algorithm:
  adv_type: gae

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # Eight ranks each process 32 samples with no gradient accumulation, giving
  # global batch 256 and twice as many optimizer updates per sampled frame as
  # the global-batch-512 acceptance gate.
  micro_batch_size: 32
  global_batch_size: 256
  seed: 42
  model:
    model_type: clothdojo_cfg_model
    model_path: ${oc.env:CLOTHDOJO_CFG_INIT_CHECKPOINT}
    precision: null
    num_action_chunks: 50
    action_dim: 14
    is_lora: false
    lora_rank: 32
    load_to_device: true
    add_value_head: false
    openpi:
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: 5
      # Guidance is an evaluation-time sweep.  Scale 1.0 directly samples the
      # positive-conditioned policy without extrapolation.
      cfgrl_guidance_scale: 1.0
      # STEAM Appendix D uses 0.1 for conditional policy optimization.
      unconditional_prob: 0.1
      train_expert_only: true
      guidance_type: positive
      # Retain distinct positive and negative conditions; do not collapse
      # negative examples into the advantage-unconditional route.
      positive_only_conditional: false
    openpi_data:
      adapt_to_pi: false
      extra_delta_transform: true
      default_prompt: Flatten the shirt.
      norm_stats_path: ${oc.env:CLOTHDOJO_PI05_NORM_STATS}
  optim:
    # Keep the accepted conservative CFGRL peak LR.  The project-verified
    # OpenPI scheduler preserves a nonzero 10% floor through the longer run.
    lr: 2.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: openpi_cosine
    lr_warmup_steps: 200
    total_training_steps: 5000
    min_lr: 2.0e-7
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: true
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
