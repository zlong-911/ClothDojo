# ClothDojo's reviewed-good Pi0.5 ALOHA SFT baseline.
# Paths remain external so this config is portable across training hosts.
hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:CLOTHDOJO_TRAIN_OUTPUT}
    project_name: clothdojo
    experiment_name: shirt_flatten_reviewed_good_pi05_aloha_40k
    logger_backends: [tensorboard]
  max_epochs: -1
  # RLINF counts optimizer updates here, not frames or epochs.
  max_steps: 40000
  val_check_interval: -1
  save_interval: 10000

data:
  # The exporter physically removes every bad range, so no trainer-side
  # episode filtering or implicit quality policy is needed.
  train_data_paths: ${oc.env:CLOTHDOJO_LEROBOT_DATASET}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # Eight workers each consume eight samples; no hidden accumulation changes
  # the historical global batch of 64.
  micro_batch_size: 8
  global_batch_size: 64
  seed: 42
  model:
    model_type: openpi
    model_path: ${oc.env:CLOTHDOJO_PI05_CHECKPOINT}
    precision: null
    num_action_chunks: 50
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 5
    add_value_head: false
    openpi:
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: ${actor.model.num_action_chunks}
      num_steps: ${actor.model.num_steps}
      train_expert_only: false
      action_env_dim: ${actor.model.action_dim}
      noise_method: flow_sde
      add_value_head: ${actor.model.add_value_head}
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: true
    openpi_data:
      # Piper already uses the ALOHA vector order and must not receive the
      # physical ALOHA joint-axis realignment.
      adapt_to_pi: false
      extra_delta_transform: true
      default_prompt: Flatten the shirt.
      norm_stats_path: ${oc.env:CLOTHDOJO_PI05_NORM_STATS}
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    # Two passes over 1,288,298 frames at global batch 64 are about 40k
    # optimizer updates. Intermediate 10k checkpoints remain comparable.
    total_training_steps: 40000
    lr_warmup_steps: 1000
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
