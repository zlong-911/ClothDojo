# Rebuild every gate with the current preflight identity. The earlier 2× full
# launch was correctly rejected after the reviewed profile set changed while
# its short gates were already running.
trials:
  - name: decay40k_lr2x_repair
    overrides:
      - experiment.profile=decay_40k_lr_2x
      - optimizer.peak_lr=5.0e-5
      - optimizer.decay_steps=40000
      - optimizer.decay_lr=5.0e-6
      - gates.pilot_steps=3000
      - logging.run_name=shirt_flatten_reviewed_good_pi05_jax_decay40k_lr2x
