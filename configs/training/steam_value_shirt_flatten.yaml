# One independently trained STEAM member. Launch this config three times with
# --member-index 0, 1, and 2 on disjoint 8-GPU nodes, then `clothdojo steam merge`.
hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  # Each driver attaches to the same submitted four-node Ray cluster but uses
  # only the node selected by CLOTHDOJO_STEAM_PLACEMENT.
  num_nodes: 4
  component_placement:
    actor,env,rollout: ${oc.env:CLOTHDOJO_STEAM_PLACEMENT}

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:CLOTHDOJO_STEAM_OUTPUT}
    project_name: clothdojo
    experiment_name: train
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths:
    - dataset_path: ${oc.env:CLOTHDOJO_STEAM_DATASET}
      type: sft
  balance_weights: true
  seed: 42
  dataset_type: sft
  only_success: false
  camera_keys:
    - observation.images.cam_high
    - observation.images.cam_low
  k: 64
  length_scale_enabled: true
  length_scale_percentile: 90.0
  min_episode_length: 2
  train_num_workers: 8
  eval_num_workers: 0
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  do_augment: false

actor:
  # The CLI replaces this with SteamMember{0,1,2}, avoiding Ray name clashes.
  group_name: SteamMember
  training_backend: fsdp
  # 8 ranks x 32 samples x 2 accumulation steps = global batch 512.
  micro_batch_size: 32
  global_batch_size: 512
  seed: 0
  model:
    model_type: steam_value_model
    # FP32 master weights with BF16 forward compute passed the fixed-batch gate.
    precision: fp32
    vision_repo_id: ${oc.env:CLOTHDOJO_STEAM_SIGLIP_CHECKPOINT}
    language_repo_id: ${oc.env:CLOTHDOJO_STEAM_GEMMA3_CHECKPOINT}
    tokenizer_path: ${oc.env:CLOTHDOJO_STEAM_GEMMA3_CHECKPOINT}
    fusion_hidden_dim: 512
    dropout: 0.1
    label_smoothing: 0.05
    num_frames_per_pair: 2
    num_bins: 32
    ensemble_size: 1
    ensemble_head_seed_base: null
    freeze_vision_encoder: false
    freeze_language_model: false
    include_state: true
    state_dim: 14
    state_mean: [-0.09130460198748173, 1.534360439898294, -0.8491337117536908, 0.41763512970854105, -0.19170672775405667, -0.26063104876665133, 0.498094105954187, 0.098363660399659, 1.5616428570626042, -0.8968999516842421, -0.37229350495645835, -0.11400524817279399, 0.22605513278499603, 0.5758188154666153]
    state_std: [0.3333473569658152, 0.47381318335605294, 0.5573842815016516, 1.1587150335616125, 0.49594546215353075, 1.1372927327255176, 0.47805141578002824, 0.3291216401600916, 0.46855078642091325, 0.6144141501822465, 1.19307290809216, 0.5271196541377053, 1.1812336302390583, 0.4720899770404259]
    max_token_len: 16
    use_gradient_checkpointing: true
  optim:
    lr: 5.0e-5
    value_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-5
    clip_grad: 10.0
    lr_scheduler: constant
    lr_warmup_steps: 500
    total_training_steps: ${runner.max_steps}
    min_lr: 1.0e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: false
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
