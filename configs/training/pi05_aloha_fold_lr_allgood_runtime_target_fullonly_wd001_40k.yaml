defaults:
  - pi05_aloha_openpi_rlinf_mirrored_runtime_target_fullonly_wd001_40k
  - _self_

# Original plus bilateral left/right mirror over every remaining shirt-fold
# trajectory. Only complete H50 runtime-target chunks contribute to the loss.
clothdojo:
  action_chunk_boundary: full_only
  image_augmentation: false

cluster:
  num_nodes: 2
  component_placement:
    actor: all

runner:
  logger:
    experiment_name: shirt_fold_lr_allgood_runtime_target_fullonly_wd001_b256_n2_mb16_40k_s43_20260903

actor:
  # 16 H100 ranks x 16 samples = global batch 256, with no accumulation.
  micro_batch_size: 16
  global_batch_size: 256
  fsdp_config:
    enable_gradient_accumulation: false
  model:
    openpi_data:
      default_prompt: Fold the shirt.
