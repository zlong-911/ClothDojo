defaults:
  - pi05_aloha_openpi_rlinf_lr2x_60k
  - _self_

# Two-node large-batch recipe for the complete trajectory collection plus its
# bilateral mirror augmentation. B256 preserves the control's per-rank batch.
clothdojo:
  jax_reference: null
  worker_environment:
    GLOO_SOCKET_IFNAME: br0
    NCCL_SOCKET_IFNAME: br0
    NCCL_IB_DISABLE: "0"
    NCCL_IB_GID_INDEX: "0"
    NCCL_IB_HCA: "=mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"

cluster:
  num_nodes: 2
  component_placement:
    actor: all

runner:
  max_steps: 30000
  save_interval: 5000
  logger:
    experiment_name: shirt_flatten_full_mirrored_pi05_openpi_rlinf_bs256_30k_seed43

actor:
  global_batch_size: 256
  optim:
    lr: 1.0e-4
    total_training_steps: 30000
    lr_warmup_steps: 500
    min_lr: 1.0e-5
