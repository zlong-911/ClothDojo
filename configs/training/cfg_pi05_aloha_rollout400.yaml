    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_15_of_16
      type: rollout
      advantage_tag: steam_v5_step30000_dual_state_k64_rollout400
      weight: 1.0

algorithm:
  adv_type: gae

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # Sixteen ranks process 32 samples each with no gradient accumulation.
  micro_batch_size: 32
  global_batch_size: 512
  seed: 0
  model:
    model_type: clothdojo_cfg_model
    model_path: ${oc.env:CLOTHDOJO_CFG_INIT_CHECKPOINT}
    # Continue from the project's FP32-master SFT checkpoint. FSDP casts
    # operator parameters to BF16 below while Adam and reductions stay FP32.
    precision: fp32
    pi05: true
    use_proprio: true
    num_steps: 5
    num_action_chunks: 50
    action_dim: 14
    is_lora: false
    lora_rank: 32
    load_to_device: true
    add_value_head: false
    openpi:
      task: cfg
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: 5
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      discrete_state_input: true
      max_token_len: 200
      use_rlt: false
      # This is an inference parameter: STEAM reports 2.5, while the generic
      # RLINF CFG example defaults to 1.0. Preserve the paper value in the
      # checkpoint contract and evaluate a guidance sweep separately.
      cfgrl_guidance_scale: 2.5
      unconditional_prob: 0.1
      # Match the documented STEAM/RECAP route: positives receive the
      # Advantage: positive condition (with 10% dropout); negatives are the
      # unconditional branch.
      positive_only_conditional: true
      guidance_type: positive
      # Match the published CFG recipe and allow the condition tokens to alter
      # the language/VLM path instead of freezing that path at the SFT state.
      train_expert_only: false
    openpi_data:
      adapt_to_pi: false
      extra_delta_transform: true
      default_prompt: flatten the shirt
      norm_stats_path: ${oc.env:CLOTHDOJO_PI05_NORM_STATS}
  optim:
    # Use the RLINF pi0.5 CFG recipe. The STEAM paper's 5e-5 result uses pi0;
    # this continuation starts from a pi0.5 policy checkpoint.
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 5000
    total_training_steps: 30000
    min_lr: 0.0
  fsdp_config:
    strategy: fsdp
    # Preserve the working OpenPI-RLinf SFT precision/sharding contract. This
    # also avoids replicating FP32 parameters and Adam states on every rank.
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
