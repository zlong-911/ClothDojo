# Offline STEAM/CFGRL continuation over the reviewed expert set and the
# 100-asset (40 seen, 60 unseen), four-initial-state rollout round.
hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 2
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:CLOTHDOJO_TRAIN_OUTPUT}
    project_name: clothdojo
    experiment_name: shirt_flatten_cfg_pi05_rollout400
    logger_backends: [tensorboard]
  max_epochs: -1
  # STEAM uses 30k updates for every reported task despite a roughly 4x range
  # in trajectory count. Keep that update budget explicit instead of relying
  # on RLINF's epoch-derived stopping behavior.
  max_steps: 30000
  val_check_interval: -1
  save_interval: 3000

data:
  num_workers: 4
  # Match the RLINF CFG recipe: equal raw weights and size-balanced sampling.
  # With all shards at weight 1, this samples every labeled frame uniformly;
  # shard count therefore cannot change the logical source mixture.
  balance_dataset_weights: true
  seed: 42
  train_data_paths:
    - dataset_path: data/datasets/shirt_flatten_reviewed_good_v2
      type: sft
      advantage_tag: steam_v5_step30000_dual_state_k64_expert719_q80
      weight: 1.0
    # The 16 rollout shards form one logical source.
    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_00_of_16
      type: rollout
      advantage_tag: steam_v5_step30000_dual_state_k64_rollout400
      weight: 1.0
    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_01_of_16
      type: rollout
      advantage_tag: steam_v5_step30000_dual_state_k64_rollout400
      weight: 1.0
    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_02_of_16
      type: rollout
      advantage_tag: steam_v5_step30000_dual_state_k64_rollout400
      weight: 1.0
    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_03_of_16
      type: rollout
      advantage_tag: steam_v5_step30000_dual_state_k64_rollout400
      weight: 1.0
    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_04_of_16
      type: rollout
      advantage_tag: steam_v5_step30000_dual_state_k64_rollout400
      weight: 1.0
    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_05_of_16
      type: rollout
      advantage_tag: steam_v5_step30000_dual_state_k64_rollout400
      weight: 1.0
    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_06_of_16
      type: rollout
      advantage_tag: steam_v5_step30000_dual_state_k64_rollout400
      weight: 1.0
    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_07_of_16
      type: rollout
      advantage_tag: steam_v5_step30000_dual_state_k64_rollout400
      weight: 1.0
    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_08_of_16
      type: rollout
      advantage_tag: steam_v5_step30000_dual_state_k64_rollout400
      weight: 1.0
    - dataset_path: data/datasets/openpi_rlinf_lr2x_s43_60k_rtc_100assets_4states_cfg_v2_renderfix_shard_09_of_16
