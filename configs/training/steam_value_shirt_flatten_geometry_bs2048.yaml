# Three independent members run serially; each member occupies all four nodes.
defaults:
  - steam_value_shirt_flatten
  - _self_

actor:
  micro_batch_size: 32
  global_batch_size: 2048
  model:
    state_dim: 16
    state_keys: [observation.state, observation.cloth_metrics]
    # Loaded from meta/steam_state.json and checked against training parquet.
    state_mean: null
    state_std: null
    geometry_contract: null
  optim:
    lr: 1.0e-4
    value_lr: 1.0e-4
    lr_warmup_steps: 125

# Match the sample budget and warmup exposure of batch 512 / 30,000 steps.
# Batch scaling alone is not a claim of improved sample efficiency.
runner:
  max_steps: 7500
  save_interval: 500

clothdojo:
  worker_environment:
    NCCL_SOCKET_IFNAME: br0
    GLOO_SOCKET_IFNAME: br0
    NCCL_IB_DISABLE: "0"
    NCCL_IB_GID_INDEX: null
    NCCL_IB_HCA: '=mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1'
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
