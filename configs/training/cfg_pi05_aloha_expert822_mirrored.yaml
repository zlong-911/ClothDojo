defaults:
  - cfg_pi05_aloha_rollout400
  - _self_

# Expert-only continuation: 822 Good episodes and their bilateral mirrors.
# Use the source SFT's B256/Adam settings with a short, low-LR continuation.
# Keep the existing CFG routing; do not relabel or mix rollout.
runner:
  max_steps: 12000
  save_interval: 2000
  logger:
    experiment_name: shirt_flatten_cfg_pi05_expert822_mirrored
    logger_backends: [tensorboard, wandb]

actor:
  global_batch_size: 256
  micro_batch_size: 16
  seed: 43
  optim:
    lr: 1.0e-5
    lr_warmup_steps: 2000
    total_training_steps: 12000

data:
  train_data_paths:
    - dataset_path: data/datasets/shirt_flatten_good822_mirrored_nocs_geometry
      type: sft
      advantage_tag: steam_geometry_v2_step7500_expert822_mirrored_q80
      weight: 1.0
