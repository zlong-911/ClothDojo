schema: clothdojo_evaluation_protocol
format_version: 2
protocol_id: shirt_flatten_calibration
stage: calibration
task: shirt_flatten

timing:
  control_fps: 50
  horizon_seconds: 36.0
  metric_hz: 10
  stable_seconds: 1.0

metric:
  deformable_weight: 0.65
  symmetry: planar_180

success:
  # Normalized by the canonical target's planar scale. These calibration
  # values must be frozen from reference-policy data before a public report.
  deformable_distance_max: 0.08
  rigid_distance_max: null
  particle_speed_rms_max_m_s: 0.02
  require_released: true

target:
  method: default_free_settle
  min_settle_seconds: 8.0
  max_settle_seconds: 30.0
  stability_window_seconds: 1.0
  # Match benchmark success semantics; checked at metric_hz for one full window.
  speed_rms_max_m_s: 0.02
  robot_particle_collision: false
  symmetry_center_xy: [0.651, 0.0]
