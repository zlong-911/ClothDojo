schema: clothdojo_evaluation_protocol
protocol_id: shirt_flatten_calibration
stage: calibration
task: shirt_flatten

timing:
  control_fps: 50
  # A 90 s hard ceiling leaves room for slower policy recovery/regrasping.
  # Confirmed success time still distinguishes fast completion, and summaries
  # may report success at the preregistered 30/45/60/75/90 s checkpoints.
  horizon_seconds: 90.0
  metric_hz: 10

metric:
  # Planar translation is a nuisance variable for flattening. The rigid term
  # retains orientation error only; NOCS vertex correspondence still detects
  # flips, layering and incorrect 3-D shape. There is intentionally no separate
  # tabletop/workspace containment gate.
  deformable_weight: 0.65
  # Accept 0/90/180/270 degrees around table z, not arbitrary yaw or flipping.
  symmetry: planar_90

success:
  # Asset-equal one-sided 3-MAD fences over 890 unique expert terminals
  # from 182 assets (non-mirrored originals, not 919 training segments).
  # Both distances use the canonical planar scale; the rigid
  # term is translation-invariant and therefore measures orientation only.
  deformable_distance_max: 0.08880040530115366
  rigid_distance_max: 0.04309516889741644

target:
  method: default_free_settle
  min_settle_seconds: 8.0
  max_settle_seconds: 30.0
  stability_window_seconds: 1.0
  # Match benchmark success semantics; checked at metric_hz for one full window.
  speed_rms_max_m_s: 0.02
  robot_particle_collision: false
  symmetry_center_xy: [0.651, 0.0]
